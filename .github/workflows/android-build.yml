name: LiquidGlassTV Android Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build LiquidGlassTV Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify and Setup Android SDK
        run: |
          echo "Using preinstalled Android SDK at: $ANDROID_HOME"

          # Locate sdkmanager in cmdline-tools
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -perm -u+x 2>/dev/null | head -n 1)
          fi
          echo "sdkmanager located at: $SDKMANAGER"

          # Accept SDK licenses
          yes | "$SDKMANAGER" --licenses || true

          # Check platform 34
          if [ ! -d "$ANDROID_HOME/platforms/android-34" ]; then
            echo "Installing platforms;android-34..."
            "$SDKMANAGER" "platforms;android-34"
          else
            echo "platforms;android-34 is already preinstalled."
          fi

          # Check build-tools 34.0.0
          if [ ! -d "$ANDROID_HOME/build-tools/34.0.0" ]; then
            echo "Installing build-tools;34.0.0..."
            "$SDKMANAGER" "build-tools;34.0.0"
          else
            echo "build-tools;34.0.0 is already preinstalled."
          fi

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Build Debug APK
        run: |
          if [ -f "build.gradle.kts" ]; then
            PROJECT_DIR="."
          elif [ -d "LiquidGlassTV" ]; then
            PROJECT_DIR="LiquidGlassTV"
          else
            echo "Error: Could not find build.gradle.kts or LiquidGlassTV directory"
            exit 1
          fi
          cd "$PROJECT_DIR"
          echo "Building LiquidGlassTV in directory: $(pwd)"
          gradle assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiquidGlassTV-debug-apk
          path: "**/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 14

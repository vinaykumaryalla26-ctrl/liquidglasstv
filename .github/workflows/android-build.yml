name: LiquidGlassTV Android Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build LiquidGlassTV Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform 34 & Build-Tools 34.0.0
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Build Debug APK
        run: |
          if [ -f "build.gradle.kts" ]; then
            PROJECT_DIR="."
          elif [ -d "LiquidGlassTV" ]; then
            PROJECT_DIR="LiquidGlassTV"
          else
            echo "Error: Could not find build.gradle.kts or LiquidGlassTV directory"
            exit 1
          fi
          cd "$PROJECT_DIR"
          echo "Building LiquidGlassTV from directory: $(pwd)"
          gradle assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiquidGlassTV-debug-apk
          path: "**/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 14
